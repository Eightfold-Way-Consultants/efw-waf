AWSTemplateFormatVersion: '2010-09-09'
Description: >
  efw-waf-redirect — ONE generalized 301/302 bounce distribution for every apex + legacy-brand
  host. A viewer-request CloudFront Function maps the request host (by registrable apex, longest
  suffix) to its canonical target and returns a redirect at the edge — no WAF, no real origin
  (the dummy origin is never contacted). Deploy in us-east-1.

  Topology "B": all bounce sources are aliases on this single dist under one multi-SAN cert;
  declaring an alias is inert until DNS points at it, so families cut over incrementally.
  Status defaults to 302 (soak) — promote to 301 by editing params once verified.
  See [[edge-redirect-cutover-design]] + waf-cloudfront-migration.md.

Parameters:
  AcmCertificateArn:
    Type: String
    Description: us-east-1 ACM cert covering every AlternateDomainNames entry.
  AlternateDomainNames:
    Type: CommaDelimitedList
    Description: Exact source hosts to claim (apexes exact to avoid colliding with the edge dist's wildcards; legacy brands may use *.brand).
  RedirectMap:
    Type: String
    Description: >
      JSON object of registrable-apex -> target host. The function picks the LONGEST matching
      suffix key for the request host. e.g. {"db101.org":"www.db101.org","hb101.org":"mn.hb101.org"}
  DefaultTarget:
    Type: String
    Default: www.db101.org
    Description: Fallback target if no map key matches (should not happen — every alias matches a key).
  RedirectStatus:
    Type: String
    Default: '302'
    AllowedValues: ['301', '302']
    Description: 302 during soak; promote to 301 once targets are verified.
  RedirectStatusText:
    Type: String
    Default: Found
    Description: Must match RedirectStatus — 'Found' for 302, 'Moved Permanently' for 301.
  Comment:
    Type: String
    Default: efw generalized apex/legacy bounce (B)

Resources:

  RedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'efw-redirect-${AWS::StackName}'   # Function names can't contain dots
      AutoPublish: true
      FunctionConfig:
        Comment: !Ref Comment
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var req = event.request;
          var host = (req.headers.host && req.headers.host.value || '').toLowerCase();
          var MAP = ${RedirectMap};
          // longest-suffix match: exact host, or host ends with '.'+key
          var bestKey = '';
          for (var k in MAP) {
            if ((host === k || host.slice(-(k.length + 1)) === '.' + k) && k.length > bestKey.length) {
              bestKey = k;
            }
          }
          var dest = bestKey ? MAP[bestKey] : '${DefaultTarget}';
          var qs = req.querystring;
          var query = '';
          var first = true;
          for (var key in qs) {
            var v = qs[key];
            var pair = (v.value !== '' && v.value !== undefined) ? (key + '=' + v.value) : key;
            query += (first ? '?' : '&') + pair;
            first = false;
          }
          return {
            statusCode: ${RedirectStatus},
            statusDescription: '${RedirectStatusText}',
            headers: { 'location': { value: 'https://' + dest + req.uri + query } }
          };
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref Comment
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !Ref AlternateDomainNames
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        # Dummy origin — REQUIRED by CloudFront but NEVER contacted (the viewer-request function
        # returns the redirect before the cache/origin phase). A harmless valid placeholder.
        Origins:
          - Id: unused-origin
            DomainName: !Ref DefaultTarget
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: unused-origin
          ViewerProtocolPolicy: allow-all      # function returns an https Location in one hop for http+https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RedirectFunction.FunctionMetadata.FunctionARN

  # --- Per-zone indirection records (self-healing on rebuild) -------------------------------
  # One cf-redirect.<domain> per bounce zone, ALIAS -> this dist via !GetAtt. The gated apex +
  # subdomain bounce records (managed IMPERATIVELY via change-batches, NOT here) point at their
  # OWN zone's cf-redirect (apex: same-zone ALIAS->alias->dist is legal; subdomain: CNAME).
  # On a dist rebuild, redeploying this stack re-points every cf-redirect via GetAtt, so all
  # bounces auto-heal (apexes included) while the cutover records stay imperative/gated.
  # All 6 bounce zones have their pair (inert until a bounce record points at them).
  CfRedirectDisabilityA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z37FVJFDBZFWDS                 # disabilitybenefits101.org
      Name: cf-redirect.disabilitybenefits101.org.
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  CfRedirectDisabilityAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z37FVJFDBZFWDS
      Name: cf-redirect.disabilitybenefits101.org.
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  CfRedirectHousingA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z3OFPBTAG2ANJC                 # housingbenefits101.org
      Name: cf-redirect.housingbenefits101.org.
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  CfRedirectHousingAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z3OFPBTAG2ANJC
      Name: cf-redirect.housingbenefits101.org.
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  CfRedirectDb101A:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z3T3K8XH9ZMBIW                 # db101.org
      Name: cf-redirect.db101.org.
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  CfRedirectDb101AAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z3T3K8XH9ZMBIW
      Name: cf-redirect.db101.org.
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  CfRedirectVetsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z3UQCHV318XC5K                 # vets101.org
      Name: cf-redirect.vets101.org.
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  CfRedirectVetsAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z3UQCHV318XC5K
      Name: cf-redirect.vets101.org.
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  CfRedirectEightfoldA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z1KW10MTO4TFYM                 # eightfoldway.com
      Name: cf-redirect.eightfoldway.com.
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  CfRedirectEightfoldAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z1KW10MTO4TFYM
      Name: cf-redirect.eightfoldway.com.
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  CfRedirectHb101A:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z26W7416MQ6FIP                 # hb101.org
      Name: cf-redirect.hb101.org.
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  CfRedirectHb101AAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z26W7416MQ6FIP
      Name: cf-redirect.hb101.org.
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Route53 target — apex A/AAAA ALIAS + legacy CNAME/ALIAS records point here.
    Value: !GetAtt Distribution.DomainName
